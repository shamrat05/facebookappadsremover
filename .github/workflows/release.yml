name: Test, build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;35.0.0 platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Sign and checksum APK
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$apk" ]; then
            apk="app/build/outputs/apk/release/app-release.apk"
          fi
          test -f "$apk"
          mkdir -p dist
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/fbar-release.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=FBAR CI,OU=Android,O=FBAR,L=CI,S=CI,C=US"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/fbar-release.keystore" \
            --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out dist/FacebookAppAdsRemover-${GITHUB_REF_NAME}.apk "$apk"
          sha256sum "dist/FacebookAppAdsRemover-${GITHUB_REF_NAME}.apk" \
            > "dist/FacebookAppAdsRemover-${GITHUB_REF_NAME}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FacebookAppAdsRemover-${{ github.ref_name }}
          path: dist/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Facebook App Ads Remover $GITHUB_REF_NAME" \
            --generate-notes
